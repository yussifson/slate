bucket_definitions:
  global:
    data:
      - SELECT * FROM companies
      - SELECT * FROM subscription_plans
      - SELECT * FROM firm_settings
      - SELECT * FROM component_registry
      - SELECT * FROM industry_templates

  super_admin_workspace:
    parameters:
      - SELECT 1 AS is_admin FROM profiles WHERE id = request.user_id() AND role = 'super_admin'
    data:
      - SELECT * FROM profiles WHERE bucket.is_admin = 1

  staff_workspace:
