<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/optavel-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optavel Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #022c22; /* Slate dark forest green */
      }
      body { top: 0px !important; }
      
      /* Pre-loader styles */
      .app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 999999;
        color: #0f172a;
      }
      .app-preloader-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        object-fit: contain;
        animation: logoBreathe 2.5s ease-in-out infinite;
      }
      .app-preloader-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(16, 185, 129, 0.15); /* very light emerald */
        border-radius: 50%;
        border-top-color: #10B981; /* emerald-500 */
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      .app-preloader-text {
        font-size: 12px;
        font-weight: 500;
        color: #71717a;
        letter-spacing: 0.04em;
      }
      @keyframes logoBreathe {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Google Translate Overrides */
      .skiptranslate, .goog-te-banner-frame, .goog-te-balloon-frame { display: none !important; visibility: hidden !important; }
      #goog-gt-tt { display: none !important; visibility: hidden !important; }
      .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
      #google_translate_element { display: none !important; height: 0; width: 0; overflow: hidden; }
      .VIpgJd-ZVi9od-ORHb-OEVmcd { display: none !important; }
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf { display: none !important; }
    </style>
    <script>
      // Prevent React from crashing when Google Translate mutates the DOM
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) {
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="root">
      <div class="app-preloader">
        <img src="/slate-logo.png" alt="Slate Loading" class="app-preloader-logo" />
        <div class="app-preloader-spinner"></div>
        <div class="app-preloader-text">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
